name: Tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    pytest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python 3.13
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install pytest
              run: python -m pip install pytest

            - name: Run tests
              run: python -m pytest -q

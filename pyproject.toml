[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litecrate"
version = "0.2.0"
description = "A lightweight SQLite wrapper with flexible JSON storage"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/themanyfaceddemon/LiteCrate"
Documentation = "https://themanyfaceddemon.github.io/LiteCrate/"
Source = "https://github.com/themanyfaceddemon/LiteCrate"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["litecrate*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

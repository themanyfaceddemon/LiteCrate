[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litecrate"
version = "0.1.0"
description = "A lightweight SQLite wrapper with flexible JSON storage"
readme = "README.md"
license-files = ["LICENCE"]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["litecrate*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
